<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indus Wok — Restaurant POS</title>
<!-- SheetJS for Excel parsing -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --red:#d4790a; --red-d:#a85d06; --red-l:#e8a040;
    --bg:#fff9f2; --card:#ffffff; --ink:#2b2b2b; --muted:#8a8a8a;
    --line:#e8d5c0; --ok:#1c9c4a; --warn:#e08a00; --occ:#c81d25; --res:#7a52d1;
    --shadow:0 6px 18px rgba(212,121,10,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow-x:hidden;max-width:100%}
  body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
  button{cursor:pointer;border:none;border-radius:10px;font-size:14px;padding:10px 14px;background:#eee;transition:.12s}
  button:active{transform:translateY(1px)}
  input,select,textarea{font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;width:100%;background:#fff}
  .btn-primary{background:var(--red);color:#fff;font-weight:600}
  .btn-ghost{background:#fff;border:1px solid var(--line)}
  .btn-ok{background:var(--ok);color:#fff;font-weight:600}
  .btn-warn{background:var(--warn);color:#fff}
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
  .hidden{display:none!important}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .grow{flex:1;min-width:0}
  .muted{color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
  h2{margin:0 0 12px;font-size:18px}
  h3{margin:0 0 10px;font-size:15px}
  label{font-size:12px;font-weight:600;color:#555;display:block;margin:0 0 4px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-size:11px;text-transform:uppercase}
  .scroll{overflow:auto}

  /* LOGIN */
  #login{position:fixed;inset:0;background:linear-gradient(160deg,#d4790a,#7a4d06);display:flex;align-items:center;justify-content:center;z-index:100}
  .login-card{background:#fff;border-radius:20px;padding:26px;width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .pin-dots{display:flex;gap:10px;justify-content:center;margin:10px 0 14px}
  .pin-dots span{width:14px;height:14px;border-radius:50%;background:#eee;border:1px solid var(--line)}
  .pin-dots span.on{background:var(--red)}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .keypad button{padding:16px;font-size:20px;background:#fff3e5;color:var(--red-d);font-weight:700;border-radius:14px}
  .user-select{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px}
  .user-select button.sel{background:var(--red);color:#fff}

  /* APP */
  #app{display:none;min-height:100%}
  header.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px 14px}
  .top .title{font-weight:800;color:var(--red);font-size:17px}
  .daybadge{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px}
  .day-open{background:#e7f7ee;color:var(--ok)}
  .day-closed{background:#fdeceb;color:var(--red)}

  nav.tabs{display:flex;gap:6px;overflow:auto;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:49px;z-index:25}
  nav.tabs button.active{background:var(--red);color:#fff}

  main{padding:14px;max-width:1300px;margin:0 auto}
  .page{display:none}
  .page.active{display:block}

  /* TABLES */
  .tables-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:12px}
  .table-cell{border-radius:14px;padding:14px 10px;text-align:center;border:2px solid var(--line);background:#fff;cursor:pointer}
  .table-cell.occupied{border-color:#f4b8bb;background:#fff5f5}
  .table-cell .tn{font-size:22px;font-weight:800}

  /* BILLING */
  .billing-wrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px}
  .cat-bar{display:flex;gap:8px;overflow:auto;padding-bottom:6px;margin-bottom:8px}
  .cat-bar button.active{background:var(--red);color:#fff}
  .menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .menu-item{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;display:flex;flex-direction:column;gap:4px}
  .size-btns{display:flex;gap:6px;margin-top:auto}
  .size-btns button{flex:1;padding:8px 4px;font-weight:700;font-size:13px}
  .size-btns .sz-f{background:var(--red);color:#fff}

  .cart-items{max-height:42vh;overflow:auto;margin:6px 0}
  .ci{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
  .qbtn{width:26px;height:26px;border-radius:8px;background:#fff3e5;color:var(--red-d);font-weight:800;padding:0}
  .totals div{display:flex;justify-content:space-between;padding:3px 0;font-size:13px}
  .totals .grand{font-size:19px;font-weight:800;border-top:2px solid var(--line);margin-top:6px;padding-top:8px}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:80;padding:16px}
  .modal .box{background:#fff;border-radius:16px;padding:20px;width:520px;max-width:96vw;max-height:90vh;overflow:auto}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:11px 18px;border-radius:10px;z-index:120}

  @media(max-width:640px){
    .billing-wrap{grid-template-columns:1fr}
    .tables-grid{grid-template-columns:repeat(3,1fr)}
  }

  /* PRINT AREA */
  #print-area{display:none}
  .receipt{width:72mm;margin:0 auto;color:#000;font-family:"Courier New",monospace;font-size:12px;line-height:1.4;padding:2mm 0;font-weight:700}
  .receipt .c{text-align:center}
  .receipt hr{border:none;border-top:2px solid #000;margin:5px 0}
  .receipt table{width:100%;border-collapse:collapse}
  .receipt .tot{font-size:16px;font-weight:900}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <div style="font-size:40px">🍜</div>
    <div style="font-size:22px;font-weight:800;color:var(--red)">Indus Wok</div>
    <div class="user-select" id="userSelect"></div>
    <div class="pin-dots" id="pinDots"></div>
    <div class="keypad" id="keypad"></div>
  </div>
</div>

<div id="app">
  <header class="top">
    <div class="title">🍜 Indus Wok</div>
    <span class="daybadge" id="dayBadge"></span>
    <span id="syncBadge" style="display:none;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px"></span>
    <div id="whoBox" style="margin-left:auto;text-align:right;font-size:12px"></div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <main>
    <!-- DASHBOARD -->
    <section class="page" id="page-dash">
      <div class="row">
        <h2>📊 Dashboard</h2>
        <div class="grow"></div>
        <button class="btn-primary" id="dayInBtn" onclick="dayIn()">🟢 Day In</button>
        <button class="btn-warn" id="dayOutBtn" onclick="dayOut()">🔴 Day Out</button>
      </div>
      <div id="dashStats" class="row" style="margin-top:20px"></div>
    </section>

    <!-- TABLES -->
    <section class="page" id="page-tables">
      <div class="row">
        <h2>🪑 Tables</h2>
        <div class="grow"></div>
        <button class="btn-ghost" onclick="startTakeaway()">🛍️ Takeaway</button>
        <button class="btn-ghost" onclick="startDelivery()">🚚 Delivery</button>
      </div>
      <div class="area-tabs" id="areaTabs" style="margin:10px 0"></div>
      <div class="tables-grid" id="tablesGrid"></div>
    </section>

    <!-- BILLING -->
    <section class="page" id="page-billing">
      <div class="row" style="margin-bottom:10px">
        <button class="btn-ghost" onclick="go('tables')">← Tables</button>
        <h2 id="billingTitle">Billing</h2>
      </div>
      <div class="billing-wrap">
        <div>
          <input id="menuSearch" placeholder="🔍 Search item..." oninput="renderMenuGrid()">
          <div class="cat-bar" id="catBar"></div>
          <div class="menu-grid" id="menuGrid"></div>
        </div>
        <div class="cart card">
          <h3>🛒 Cart</h3>
          <div class="cart-items" id="cartItems"></div>
          <div class="totals" id="totals"></div>
          <div class="field" style="margin-top:10px">
            <label>Payment Mode</label>
            <select id="payMode"><option>Cash</option><option>UPI</option><option>Card</option></select>
          </div>
          <div class="row" style="margin-top:10px">
            <button class="btn-ghost grow" onclick="printKOT()">🍳 KOT</button>
            <button class="btn-ghost grow" onclick="printBill(false)">🧾 Bill</button>
            <button class="btn-ok grow" onclick="settleBill()">✅ Settle</button>
          </div>
        </div>
      </div>
    </section>

    <!-- STAFF -->
    <section class="page" id="page-staff">
      <h2>👥 Staff</h2>
      <div class="card">
        <h3>Add Staff</h3>
        <div class="row">
          <input id="stName" placeholder="Name">
          <select id="stRole"><option>Chef</option><option>Waiter</option><option>Cashier</option></select>
          <input id="stSalary" type="number" placeholder="Salary">
          <button class="btn-primary" onclick="saveStaff()">Add</button>
        </div>
      </div>
      <div class="card" style="margin-top:20px">
        <table id="staffTable">
          <thead><tr><th>Name</th><th>Role</th><th>Salary</th><th>Status</th><th>Action</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- SETTINGS -->
    <section class="page" id="page-settings">
      <h2>⚙️ Settings</h2>
      <div class="card">
        <label>Sync URL</label>
        <input id="setSyncUrl" placeholder="https://script.google.com/...">
        <button class="btn-primary" style="margin-top:10px" onclick="saveSync()">Save & Sync</button>
        <button class="btn-ok" style="margin-top:10px" onclick="syncAll()">⬆️ Upload My Data</button>
      </div>
    </section>
  </main>
</div>

<div id="modalRoot"></div>
<div id="print-area"></div>

<script>
/* CORE CONFIG */
const LS = 'indus_pos_v2';
const MENU_VERSION = 5;
const DEVICE_ID = 'dev_' + Math.random().toString(36).slice(2, 7);
const SYNC_URL = 'https://script.google.com/macros/s/AKfycbxaC6tFbhM8ytuhTF1J5w5jxT8Dfys21GObLbwvxQvTZALbwmGVIOoTUuN7QTmXyGdvtA/exec';

const $ = s => document.querySelector(s);
const money = n => '₹' + (+n || 0).toLocaleString('en-IN');
const todayStr = () => new Date().toISOString().slice(0, 10);
const nowTime = () => new Date().toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'});
const uid = p => (p || '') + Date.now().toString(36);

let DB = load();
let CUR = null, PIN = '', _syncEnabled = false, _syncPoll = null, _rev = 0, _pulling = false, _pushing = false, _pushTimer = null;
let curOrder = null, cart = null, editId = null, pendingImport = [], aiHistory = [];

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(LS));
    if (d) {
      if (!d.settings.syncUrl) d.settings.syncUrl = SYNC_URL;
      if (!d.menu || d.menu.length === 0 || d.menuVersion !== MENU_VERSION) return seed();
      return d;
    }
  } catch(e) {}
  return seed();
}

function save() {
  localStorage.setItem(LS, JSON.stringify(DB));
  if (_syncEnabled) {
    clearTimeout(_pushTimer);
    _pushTimer = setTimeout(pushNow, 800);
  }
}

function seed() {
  const menu = [];
  const a = (cat, sub, name, full) => menu.push({id: uid('m'), cat, sub, name, full, half: full-60, veg: 'veg'});
  
  a("Soups", "Chicken", "Chicken Manchow", 150);
  a("Soups", "Chicken", "Chicken Lung Fung", 180);
  a("Soups", "Veg", "Veg Manchow", 130);
  a("Starters", "Chicken", "Dragon Chicken", 260);
  a("Starters", "Chicken", "Chicken 65", 230);
  a("Rice", "Chicken", "Triple Schezwan Rice", 240);
  a("Noodles", "Veg", "Hakka Noodles", 180);
  a("Ramen", "Chicken", "Spicy Korean Ramen", 450);

  const tables = [];
  for(let i=1; i<=10; i++) tables.push({id: 'GF'+i, no: i, area: 'Ground Floor', status: 'available'});

  return {
    settings: { name: 'Indus Wok', tagline: 'Pan-Asian Cuisine', syncUrl: SYNC_URL, upi: 'merchant@upi' },
    users: [{name: 'Owner', pin: '1111', role: 'Owner'}],
    menu, tables, bills: [], staff: [], sessions: [], carts: {}, menuVersion: MENU_VERSION
  };
}

/* SYNC LOGIC */
function syncUrl() { return (DB.settings.syncUrl || '').trim(); }

async function pullNow(opts = {}) {
  const url = syncUrl();
  if (!url || _pulling) return;
  _pulling = true;
  try {
    const sep = url.includes('?') ? '&' : '?';
    const res = await fetch(url + sep + 'action=get');
    const j = await res.json();
    if (j && j.rev !== undefined && (j.rev > _rev || opts.force)) {
      applyRemote(j);
      _rev = j.rev;
      setSyncBadge('ok');
    }
  } catch(e) { setSyncBadge('err'); }
  _pulling = false;
}

async function pushNow() {
  const url = syncUrl();
  if (!_syncEnabled || !url || _pushing) return;
  _pushing = true;
  try {
    const snap = { bills: DB.bills, menu: DB.menu, staff: DB.staff, carts: DB.carts, settings: DB.settings, sessions: DB.sessions };
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ type: 'put', data: snap })
    });
    const j = await res.json();
    if (j.rev) _rev = j.rev;
    setSyncBadge('ok');
  } catch(e) { setSyncBadge('err'); }
  _pushing = false;
}

function applyRemote(j) {
  // Sync core data
  if (j.menu) DB.menu = j.menu;
  if (j.staff) DB.staff = j.staff;
  if (j.bills) DB.bills = j.bills;
  if (j.sessions) DB.sessions = j.sessions;
  
  // Sync live carts but protect the current one
  const currentKey = cart ? cart.key : null;
  if (j.carts) {
    Object.keys(j.carts).forEach(k => {
      if (k !== currentKey) DB.carts[k] = j.carts[k];
    });
  }
  
  localStorage.setItem(LS, JSON.stringify(DB));
  refreshActivePage();
}

function setSyncBadge(s) {
  const el = $('#syncBadge');
  if (!el) return;
  el.style.display = 'inline-block';
  if (s === 'ok') { el.textContent = '☁️ Synced'; el.style.background = '#e7f7ee'; el.style.color = '#1c9c4a'; }
  else { el.textContent = '☁️ Error'; el.style.background = '#fdeceb'; el.style.color = '#d4790a'; }
}

function startSync() {
  _syncEnabled = !!syncUrl();
  if (_syncPoll) clearInterval(_syncPoll);
  if (_syncEnabled) {
    pullNow({force:true});
    _syncPoll = setInterval(pullNow, 5000);
  }
}

/* UI LOGIC */
function go(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  $(`#page-${id}`).classList.add('active');
  if (id === 'tables') renderTables();
  if (id === 'staff') renderStaff();
  if (id === 'billing') renderCart();
}

function renderTables() {
  const grid = $('#tablesGrid'); grid.innerHTML = '';
  DB.tables.forEach(t => {
    const c = DB.carts[t.id];
    const isOcc = c && c.items.length > 0;
    const div = document.createElement('div');
    div.className = 'table-cell' + (isOcc ? ' occupied' : '');
    div.innerHTML = `<div class="tn">${t.no}</div><div>${isOcc ? 'OCCUPIED' : 'OPEN'}</div>`;
    div.onclick = () => {
      curOrder = {type: 'Dine-in', tableId: t.id, tableNo: t.no};
      cart = DB.carts[t.id] || {key: t.id, items: [], phone: ''};
      DB.carts[t.id] = cart;
      $('#billingTitle').textContent = 'Table ' + t.no;
      go('billing');
      buildCatBar();
      renderMenuGrid();
    };
    grid.appendChild(div);
  });
}

function buildCatBar() {
  const bar = $('#catBar'); bar.innerHTML = '';
  const cats = [...new Set(DB.menu.map(m => m.cat))];
  cats.forEach(c => {
    const btn = document.createElement('button');
    btn.textContent = c;
    btn.onclick = () => renderMenuGrid(c);
    bar.appendChild(btn);
  });
}

function renderMenuGrid(cat) {
  const grid = $('#menuGrid'); grid.innerHTML = '';
  const items = cat ? DB.menu.filter(m => m.cat === cat) : DB.menu;
  items.forEach(m => {
    const div = document.createElement('div');
    div.className = 'menu-item';
    div.innerHTML = `<b>${m.name}</b><div>${money(m.full)}</div>
      <div class="size-btns"><button class="sz-f" onclick="addToCart('${m.id}')">Add</button></div>`;
    grid.appendChild(div);
  });
}

function addToCart(id) {
  const m = DB.menu.find(x => x.id === id);
  const ex = cart.items.find(i => i.id === id);
  if (ex) ex.qty++; else cart.items.push({id: m.id, name: m.name, price: m.full, qty: 1});
  save(); renderCart(); toast('Added ' + m.name);
}

function renderCart() {
  const box = $('#cartItems'); box.innerHTML = '';
  let sub = 0;
  cart.items.forEach((i, idx) => {
    sub += i.price * i.qty;
    box.innerHTML += `<div class="ci"><div class="grow">${i.name}</div>
      <button class="qbtn" onclick="updateQty(${idx},-1)">-</button><b>${i.qty}</b><button class="qbtn" onclick="updateQty(${idx},1)">+</button>
      <div style="width:60px;text-align:right">${money(i.price * i.qty)}</div></div>`;
  });
  $('#totals').innerHTML = `<div class="grand"><span>TOTAL</span><span>${money(sub)}</span></div>`;
}

function updateQty(idx, d) {
  cart.items[idx].qty += d;
  if (cart.items[idx].qty <= 0) cart.items.splice(idx, 1);
  save(); renderCart();
}

function settleBill() {
  if (!cart.items.length) return;
  confirmDlg("Settle this bill?", () => {
    const bill = { no: 'B'+Date.now().toString().slice(-5), items: [...cart.items], total: cart.items.reduce((a,b)=>a+(b.price*b.qty),0), date: todayStr(), time: nowTime() };
    DB.bills.push(bill);
    DB.carts[cart.key] = {key: cart.key, items: [], phone: ''};
    save();
    go('tables');
    toast("✅ Bill Settled");
  });
}

/* STAFF LOGIC */
function saveStaff() {
  const name = $('#stName').value;
  if (!name) return;
  DB.staff.push({id: uid('st'), name, role: $('#stRole').value, salary: $('#stSalary').value});
  save(); renderStaff(); $('#stName').value = '';
}

function renderStaff() {
  const tb = $('#staffTable tbody'); tb.innerHTML = '';
  DB.staff.forEach(s => {
    tb.innerHTML += `<tr><td>${s.name}</td><td>${s.role}</td><td>${money(s.salary)}</td><td>Active</td>
      <td><button onclick="delStaff('${s.id}')">🗑️</button></td></tr>`;
  });
}

function delStaff(id) {
  confirmDlg("Delete staff?", () => {
    DB.staff = DB.staff.filter(s => s.id !== id);
    save(); renderStaff();
  });
}

/* UTILS */
function openModal(html) { $('#modalRoot').innerHTML = `<div class="modal">${html}</div>`; }
function closeModal() { $('#modalRoot').innerHTML = ''; }
function confirmDlg(msg, cb) {
  openModal(`<div class="box"><h3>Confirm</h3><p>${msg}</p><div class="row">
    <button class="grow" onclick="closeModal()">Cancel</button>
    <button class="btn-primary grow" id="confOk">Yes</button></div></div>`);
  $('#confOk').onclick = () => { closeModal(); cb(); };
}
function toast(m) {
  const e = document.createElement('div'); e.className = 'toast'; e.textContent = m;
  document.body.appendChild(e); setTimeout(() => e.remove(), 2000);
}

function renderLogin() {
  const us = $('#userSelect'); us.innerHTML = '';
  DB.users.forEach(u => {
    const b = document.createElement('button'); b.textContent = u.name;
    b.onclick = () => { CUR = u; tryLogin(); };
    us.appendChild(b);
  });
}

function tryLogin() {
  $('#login').style.display = 'none'; $('#app').style.display = 'block';
  const nav = $('#tabs'); nav.innerHTML = '';
  [['dash','📊 Dash'],['tables','🪑 Tables'],['staff','👥 Staff'],['settings','⚙️ Settings']].forEach(([id,l])=>{
    const b = document.createElement('button'); b.textContent = l; b.onclick = () => go(id); nav.appendChild(b);
  });
  go('tables'); startSync();
}

renderLogin();
</script>
</body>
</html>
